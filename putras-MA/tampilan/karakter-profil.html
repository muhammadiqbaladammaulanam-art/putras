<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Master Karakter - putras-MA</title>
    <link rel="stylesheet" href="karakter-profil.css">
</head>
<body>

    <div class="main-profil-container">
        
        <!-- SIDEBAR KIRI NAVIGASI -->
        <div class="sidebar-kiri">
            <button class="btn-kembali-lobi" onclick="pindahHalamanProfil('menu-utama-game.html')">◀ KEMBALI</button>
            <div class="wrapper-menu-status">
                <button class="btn-status-nav" onclick="scrollToKategoriStatus('SPESIAL')">SPESIAL</button>
                <button class="btn-status-nav" onclick="scrollToKategoriStatus('RAIU')">RAIU</button>
                <button class="btn-status-nav" onclick="scrollToKategoriStatus('STARS')">STARS</button>
                <button class="btn-status-nav" onclick="scrollToKategoriStatus('SKY')">SKY</button>
            </div>
            <button class="btn-karakter-dimiliki" onclick="pindahHalamanProfil('karakter/karakter-dimiliki.html')">KARAKTER DIMILIKI</button>
        </div>

        <!-- AREA UTAMA KANAN TEMPAT KARTU KARAKTER -->
        <div class="area-galeri-kanan" id="area-galeri-kanan">
            <!-- Kartu karakter akan disuntik otomatis ke sini oleh JavaScript -->
        </div>

    </div>

    <!-- POP-UP NOVEL LATAR BELAKANG (LORE) GLOBAL -->
    <div id="panel-pop-up-lore-global" class="overlay-pop-up-lore hide-pop-up-lore">
        <div class="wrapper-pop-up-lore">
            <div class="header-pop-up-lore">
                <h3 id="txt-judul-lore-char">LORE</h3>
                <button class="btn-close-lore" onclick="tutupPopUpLoreKarakter()">X</button>
            </div>
            <div class="body-pop-up-lore" id="txt-isi-novel-lore">
                <!-- Narasi cerita muncul di sini -->
            </div>
        </div>
    </div>

    <!-- Menghubungkan Script Sistem Game -->
    <script src="../system/save.js"></script>
    <script src="../system/karakter-profil.js"></script>
</body>
</html>
