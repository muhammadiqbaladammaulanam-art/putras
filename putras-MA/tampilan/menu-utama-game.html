<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - putras-MA</title>
    <link rel="stylesheet" href="menu-utama-game.css">
</head>
<body>

    <!-- Container Utama Lobi -->
    <div class="lobby-container">

        <!-- ========================================== -->
        <!-- POJOK KIRI ATAS: AREA PROFIL PEMAIN        -->
        <!-- ========================================== -->
        <div class="header-profil-kiri" onclick="pindahKeHalaman('profil.html')" title="Klik untuk lihat Profil Lengkap">
            <div class="avatar-lingkaran-lobi">
                <img id="display-foto-lobi" src="" alt="Foto Profil">
            </div>
            <div class="nama-pemain-lobi" id="display-nama-lobi">Memuat...</div>
        </div>

        <!-- ========================================== -->
        <!-- POJOK KANAN ATAS: AREA DOMPET / MATA UANG  -->
        <!-- ========================================== -->
        <div class="header-dompet-kanan">
            <!-- Slot Mata Uang Star (Reguler) -->
            <div class="slot-mata-uang">
                <div class="ikon-mata-uang">
                    <!-- === TARUH IKON GAMBAR MATA UANG STAR ANDA DI SINI === -->
                    <span class="placeholder-icon-star">★</span>
                </div>
                <div class="jumlah-angka-uang" id="display-star-lobi">0</div>
            </div>

            <!-- Slot Mata Uang Sky (Premium) -->
            <div class="slot-mata-uang">
                <div class="ikon-mata-uang">
                    <!-- === TARUH IKON GAMBAR MATA UANG SKY ANDA DI SINI === -->
                    <span class="placeholder-icon-sky">✦</span>
                </div>
                <div class="jumlah-angka-uang" id="display-sky-lobi">0</div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- SISI KIRI TENGAH KE BAWAH: GAMBAR KARAKTER -->
        <!-- ========================================== -->
        <div class="wrapper-karakter-2d">
            <!-- === TARUH FILE GAMBAR 2D KARAKTER UTAMA ANDA DI SINI === -->
            <div class="placeholder-gambar-karakter-2d"></div>
        </div>

        <!-- ========================================== -->
        <!-- POJOK KANAN BAWAH: BARISAN TOMBOL RAPAT    -->
        <!-- ========================================== -->
        <div class="footer-navigasi-kanan">
            <!-- Tombol Silver Fitur Lainnya (Berbaris dari kiri ke kanan menuju tombol utama) -->
            <button class="btn-fitur btn-silver" onclick="pindahKeHalaman('inventory.html')">INVENTORY</button>
            <button class="btn-fitur btn-silver" onclick="pindahKeHalaman('formasi.html')">FORMASI</button>
            <button class="btn-fitur btn-silver" onclick="pindahKeHalaman('gacha.html')">GACHA</button>
            <button class="btn-fitur btn-silver" onclick="pindahKeHalaman('toko.html')">TOKO</button>
            
            <!-- Blok Khusus Pojok Kanan Paling Ujung (Cerita + Karakter Melayang di Atasnya) -->
            <div class="wrapper-kolom-cerita-karakter">
                <button class="btn-fitur btn-silver btn-karakter-atas" onclick="pindahKeHalaman('karakter-profil.html')">KARAKTER</button>
                <button class="btn-fitur btn-cerita-biru" onclick="pindahKeHalaman('cerita-utama.html')">CERITA</button>
            </div>
        </div>

    </div>

    <!-- Menghubungkan ke script save global dan script lobi -->
    <script src="../system/save.js"></script>
    <script src="../system/menu-utama-game.js"></script>
</body>
</html>
