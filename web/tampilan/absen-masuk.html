<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Masuk - Jurnal Absensi</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="app-container">
        <!-- Dashboard Kiri -->
        <aside class="sidebar">
            <h3>Dashboard</h3>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="absen-masuk.html" class="active">Absen Masuk</a></li>
                <li><a href="lihat-absensi.html">lihat-absensi</a></li>
            </ul>
        </aside>

        <!-- Konten Utama Form Absen Masuk -->
        <main class="main-content">
            <header>
                <h2 id="judulForm">Buat New Absen Jurnal</h2>
            </header>

            <form id="formJurnalAbsensi">
                
                <!-- TAHAP ATAS: Informasi Waktu Otomatis (Tidak Perlu Ketik Manual Lagi) -->
                <section class="form-section">
                    <h3>Identitas Waktu Jurnal</h3>
                    <p style="color: #666; font-style: italic; font-size: 14px;">
                        tanggal waktu dan semacamnya sudah otomatis ya hehe udah ku revisi pak
                    </p>
                </section>

                <!-- TAHAP BAWAH: Input Absen Siswa -->
                <section class="form-section">
                    <h3>Isi Data Siswa</h3>
                    <div class="input-siswa-group">
                        <div class="form-group mini">
                            <label for="noAbsen">No Absen:</label>
                            <input type="number" id="noAbsen" placeholder="01">
                        </div>
                        <div class="form-group">
                            <label for="namaSiswa">Nama Siswa:</label>
                            <input type="text" id="namaSiswa" placeholder="Masukkan nama siswa">
                        </div>
                        <div class="form-group">
                            <label for="statusKeterangan">Keterangan:</label>
                            <select id="statusKeterangan">
                                <option value="Belum Diketahui">Belum Diketahui</option>
                                <option value="Hadir">Hadir</option>
                                <option value="Alpha">Alpha</option>
                            </select>
                        </div>
                        <button type="button" id="btnTambahSiswa">Tambah Ke Daftar</button>
                    </div>

                    <h4>Daftar Absensi Siswa Hari Ini</h4>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 10%;">No Absen</th>
                                <th style="width: 50%;">Nama Siswa</th>
                                <th style="width: 40%;">Keterangan Kehadiran</th>
                            </tr>
                        </thead>
                        <tbody id="listSiswaSementara">
                            <!-- Baris nama siswa muncul di sini -->
                        </tbody>
                    </table>
                </section>

                <button type="submit" class="btn-simpan-jurnal">Simpan Seluruh Jurnal Absensi</button>
            </form>
        </main>
    </div>

    <script src="../system/absen-masuk.js"></script>
</body>
</html>
